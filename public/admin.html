<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trishul Capital Admin</title><style>
:root{--bg:#050505;--panel:#0d0d0d;--gold:#d6ad43;--gold2:#f4d47b;--line:#292719;--muted:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:14px Arial,sans-serif;padding:30px}main{max-width:1100px;margin:auto;background:var(--panel);padding:30px;border:1px solid #292929;border-radius:14px}h1,h2{font-family:Georgia,serif}h1{color:var(--gold2)}h2{margin-top:34px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;background:#111;color:#fff;border:1px solid #444;border-radius:5px}textarea{min-height:130px}button{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#000;font-weight:bold;cursor:pointer;border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid #333;padding:14px;margin:8px 0;border-radius:8px;color:#bbb}.item b{color:#fff}.muted{color:var(--muted)}.danger{background:#2b1717;color:#fff;border:1px solid #633}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center}.status{padding:7px 10px;border:1px solid #3d341c;color:var(--gold2);border-radius:20px;font-size:12px}.hidden{display:none}.notice{padding:12px;border:1px solid #3d341c;background:#151208;color:#d9c787;border-radius:6px;margin:10px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid,.two{grid-template-columns:1fr}body{padding:12px}main{padding:20px}}
</style></head><body><main>
<div class="bar"><div><h1>TRISHUL CAPITAL — PRIVATE ADMIN</h1><p class="muted">This dashboard is intentionally not linked from the public website.</p></div><div id="apiStatus" class="status">Checking API…</div></div>
<div id="login"><input id="u" autocomplete="username" placeholder="Username"><input id="p" autocomplete="current-password" type="password" placeholder="Password"><button onclick="login()">Login</button><div id="loginMsg" class="notice hidden"></div></div>
<div id="app" class="hidden">
<h2>Performance / Client Accounts</h2><button class="new-client" onclick="newAccount()">Add New Client</button><div class="grid"><input id="name" placeholder="Display name"><input id="pkg" placeholder="Package / EA"></div><div class="grid"><select id="kind"><option value="performance">Performance account</option><option value="client">Client account</option></select><input id="url" placeholder="Myfxbook public URL"></div><button onclick="addAccount()">Add Account</button><div id="accounts"></div>
<h2>Social Media</h2><div class="grid"><select id="sp"><option>Instagram</option><option>WhatsApp</option><option>Telegram</option><option>Facebook</option><option>YouTube</option><option>TikTok</option><option>LinkedIn</option><option>X</option><option>Discord</option><option>Custom</option></select><input id="su" placeholder="Profile / contact URL"></div><input id="customSp" class="hidden" placeholder="Custom platform name"><button onclick="addSocial()">Add social link</button><div id="socials"></div>
<h2>Contact</h2><div class="grid"><input id="email" placeholder="Email"><input id="wa" placeholder="WhatsApp URL / number"></div><input id="tg" placeholder="Telegram URL"><button onclick="saveContact()">Save contact</button>
<h2>About Us — Founder Photo</h2><div class="item"><img id="founderImagePreview" class="hidden" alt="Current founder photo" style="max-width:220px;max-height:260px;object-fit:cover;border:1px solid #3b341b;border-radius:12px;margin:8px 0"><p id="founderImageStatus" class="muted">No founder photo uploaded.</p><input id="founderImageFile" type="file" accept="image/jpeg,image/png,image/webp"><button onclick="uploadFounderImage()">Upload / replace founder photo</button><button class="danger" onclick="removeFounderImage()">Remove founder photo</button><p class="muted">JPEG, PNG, or WebP; maximum file size 5 MB.</p></div>
<h2>Future Pages</h2><div class="grid"><input id="slug" placeholder="Slug, e.g. /faq"><input id="title" placeholder="Title"></div><textarea id="body" placeholder="Page content"></textarea><button onclick="addPage()">Create page</button><div id="pages"></div>
</div></main>
<script src="/config.js"></script><script>
let token='';const API_BASE=(window.TRISHUL_API_URL||'').replace(/\/$/,'');const $=id=>document.getElementById(id);const api=async(p,o={})=>{let r=await fetch(API_BASE+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d};
async function checkApi(){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);$('apiStatus').textContent='Checking API…';try{const response=await fetch(API_BASE+'/api/health',{signal:controller.signal});if(!response.ok)throw Error(`Health check returned ${response.status}`);const result=await response.json();if(!result.ok)throw Error('Health check failed');$('apiStatus').textContent='API connected'}catch(error){$('apiStatus').textContent=error.name==='AbortError'?'API check timed out':'API unavailable';console.error('API health check failed:',error)}finally{clearTimeout(timeout)}}checkApi();
$('sp').onchange=()=>$('customSp').classList.toggle('hidden',$('sp').value!=='Custom');
async function login(){try{let r=await fetch(API_BASE+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value.trim().toLowerCase(),password:$('p').value})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.token)throw Error(d.message||'Login failed');token=d.token;sessionStorage.setItem('trishul_admin_token',token);$('login').classList.add('hidden');$('app').classList.remove('hidden');load();}catch(e){$('loginMsg').textContent=e.message;$('loginMsg').classList.remove('hidden')}}
async function load(){try{let a=await api('/api/admin/accounts');$('accounts').innerHTML=a.accounts.map(x=>`<div class=item><b>${x.name}</b> — ${x.kind}<br>${x.myfxbook_url} <button class="danger" onclick="del(${x.id})">Deactivate</button></div>`).join('')||'<p class=muted>No accounts.</p>';let s=await api('/api/admin/socials');$('socials').innerHTML=s.items.map(x=>`<div class=item><b>${x.platform}</b> — ${x.url}</div>`).join('')||'<p class=muted>No social links.</p>';let c=await api('/api/settings/contact');$('email').value=c.email||'';$('wa').value=c.whatsapp||'';$('tg').value=c.telegram||'';let p=await api('/api/admin/pages');$('pages').innerHTML=p.pages.map(x=>`<div class=item><b>${x.title}</b> (${x.slug})</div>`).join('')||'<p class=muted>No custom pages.</p>';loadFounderImage();}catch(e){alert(e.message)}}
function loadFounderImage(){const preview=$('founderImagePreview'),status=$('founderImageStatus');preview.onload=()=>{preview.classList.remove('hidden');status.textContent='Current founder photo'};preview.onerror=()=>{preview.classList.add('hidden');status.textContent='No founder photo uploaded.'};preview.src=API_BASE+'/api/about/founder-image?v='+Date.now()}
function readImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Could not read the selected image'));reader.readAsDataURL(file)})}
async function uploadFounderImage(){const file=$('founderImageFile').files[0];if(!file)return alert('Choose a founder photo to upload');if(file.size>5*1024*1024)return alert('Founder images must be 5 MB or smaller');if(!['image/jpeg','image/png','image/webp'].includes(file.type))return alert('Choose a JPEG, PNG, or WebP image');try{const image=await readImage(file);await api('/api/admin/about/founder-image',{method:'PUT',body:JSON.stringify({image})});$('founderImageFile').value='';loadFounderImage();alert('Founder photo uploaded')}catch(error){alert(error.message)}}
async function removeFounderImage(){if(!confirm('Remove the founder photo from the About Us page?'))return;try{await api('/api/admin/about/founder-image',{method:'DELETE'});$('founderImageFile').value='';loadFounderImage();alert('Founder photo removed')}catch(error){alert(error.message)}}
async function addAccount(){await api('/api/admin/accounts',{method:'POST',body:JSON.stringify({kind:$('kind').value,name:$('name').value,package_name:$('pkg').value,myfxbook_url:$('url').value})});$('name').value=$('pkg').value=$('url').value='';load()}
function newAccount(){$('name').value='';$('pkg').value='';$('url').value='';$('kind').value='client';$('name').focus()}
async function del(id){await api('/api/admin/accounts/'+id,{method:'DELETE'});load()}
async function addSocial(){let platform=$('sp').value==='Custom'?$('customSp').value:$('sp').value;await api('/api/admin/socials',{method:'POST',body:JSON.stringify({platform,url:$('su').value})});$('su').value=$('customSp').value='';load()}
async function saveContact(){for(const [key,value] of [['contact_email',$('email').value],['contact_whatsapp',$('wa').value],['contact_telegram',$('tg').value]])await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({key,value})});alert('Contact details saved')}
async function addPage(){await api('/api/admin/pages',{method:'POST',body:JSON.stringify({slug:$('slug').value,title:$('title').value,body:$('body').value})});$('slug').value=$('title').value=$('body').value='';load()}
const saved=sessionStorage.getItem('trishul_admin_token');if(saved){token=saved;api('/api/admin/accounts').then(()=>{$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}).catch(()=>sessionStorage.removeItem('trishul_admin_token'))}
</script></body></html>
