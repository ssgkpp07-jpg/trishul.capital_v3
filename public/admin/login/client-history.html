<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Transaction History | Trishul Capital</title>
  <style>
    :root{--bg:#050505;--panel:#0d0d0d;--gold:#d6ad43;--gold2:#f4d47b;--muted:#999;--line:#292929}
    *{box-sizing:border-box}
    body{margin:0;padding:30px;background:var(--bg);color:#f4f0e6;font:14px Arial,sans-serif}
    main{max-width:1100px;margin:auto;padding:30px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
    .top,.toolbar,.history-heading{display:flex;justify-content:space-between;align-items:center;gap:16px}
    .eyebrow{color:var(--gold);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
    h1{margin:8px 0;color:var(--gold2);font:32px Georgia,serif}
    h2{margin:0;font:22px Georgia,serif}
    .muted,.subtle{color:var(--muted)}
    .subtle{margin:0}
    .rule{margin:24px 0;border:0;border-top:1px solid var(--line)}
    .actions{display:flex;gap:8px}
    button,.button-link{display:inline-block;width:auto;margin:0;padding:10px 14px;border:1px solid #574821;border-radius:5px;background:#111;color:var(--gold2);font-weight:bold;text-decoration:none;cursor:pointer}
    button:hover,.button-link:hover{background:#19160e}
    .summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:28px}
    .stat{padding:17px;border:1px solid #343126;border-radius:7px;background:#111}
    .stat span{display:block;color:#aaa;font-size:12px}
    .stat strong{display:block;margin-top:9px;color:var(--gold2);font-size:21px}
    .history-heading{margin-bottom:14px}
    .tag{padding:7px 10px;border:1px solid #544520;border-radius:20px;color:var(--gold2);font-size:11px}
    .toolbar{margin-bottom:10px;color:var(--muted)}
    input,select{padding:10px;background:#111;color:#eee;border:1px solid #444;border-radius:5px}
    #historySearch{width:min(100%,420px)}
    .table-wrap{overflow-x:auto;border:1px solid #333;border-radius:6px}
    table{width:100%;border-collapse:collapse;min-width:650px}
    th,td{padding:13px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
    th{background:#13120e;color:var(--gold2)}
    tbody tr:hover{background:#141414}
    .credit{color:#7fd49a}
    .debit{color:#f09c8b}
    .deleted{color:#888;text-decoration:line-through}
    .pagination{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:10px;color:#aaa}
    .pagination select{width:auto;padding:8px}
    .pagination button{padding:8px 12px}
    .pagination button:disabled{opacity:.45;cursor:default}
    .notice{margin:12px 0;padding:12px;border:1px solid #63332f;border-radius:6px;background:#190d0c;color:#ffb6ad}
    .empty{text-align:center;color:#aaa}
    @media(max-width:650px){body{padding:12px}main{padding:18px}.top,.toolbar,.history-heading{align-items:stretch;flex-direction:column}.actions{width:100%}.actions>*{flex:1;text-align:center}h1{font-size:26px}.summary{grid-template-columns:1fr}.pagination{justify-content:flex-start;flex-wrap:wrap}}
    @media print{
      @page{margin:16mm}
      body{padding:0;background:#fff;color:#111;font-size:11pt}
      main{max-width:none;padding:0;border:0;background:#fff}
      .actions,.toolbar,.pagination,.notice,.tag{display:none!important}
      h1,.stat strong,th{color:#111!important}
      .eyebrow,.muted,.subtle,.stat span{color:#444!important}
      .summary{break-inside:avoid}
      .stat,.table-wrap{border-color:#aaa;background:#fff}
      th,td{border-color:#bbb}
      tbody tr:hover{background:transparent}
      .credit,.debit{color:#111}
    }
  </style>
</head>
<body>
  <main>
    <header class="top">
      <div>
        <div class="eyebrow">Portfolio ledger · Client history</div>
        <h1 id="clientName">Client transaction history</h1>
        <p id="clientId" class="subtle"></p>
      </div>
      <div class="actions">
        <a class="button-link" href="/admin/login">← Back to Portfolio Ledger</a>
        <button type="button" onclick="window.print()">Print / Save as PDF</button>
      </div>
    </header>
    <hr class="rule">
    <section class="summary" aria-label="Client transaction summary">
      <div class="stat"><span>Total funds onboarded</span><strong id="fundsOnboarded">—</strong></div>
      <div class="stat"><span>Profits withdrawn</span><strong id="profitsWithdrawn">—</strong></div>
      <div class="stat"><span>Transactions</span><strong id="transactionCount">—</strong></div>
    </section>
    <section>
      <div class="history-heading">
        <h2>Transaction history</h2>
        <span class="tag" id="accountCount">Loading accounts…</span>
      </div>
      <div class="toolbar">
        <input id="historySearch" type="search" placeholder="Search account or transaction type" aria-label="Search account or transaction type">
        <span>Newest transactions first</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date &amp; time</th><th>Account number</th><th>Transaction</th><th>Funds (USD)</th></tr></thead>
          <tbody id="historyRows"><tr><td colspan="4" class="empty">Loading transaction history…</td></tr></tbody>
        </table>
      </div>
      <nav class="pagination" id="pagination" aria-label="Transaction history pages">
        <label>Rows per page
          <select id="pageSize" aria-label="Rows per page"><option>10</option><option>20</option><option>30</option><option>50</option></select>
        </label>
        <span id="pageStatus" aria-live="polite"></span>
        <button id="previousPage" type="button">Previous</button>
        <button id="nextPage" type="button">Next</button>
      </nav>
      <div id="pageError" class="notice" role="alert" hidden></div>
    </section>
  </main>
  <script src="/config.js"></script>
  <script>
    const API_BASE = (window.TRISHUL_API_URL || '').replace(/\/$/, '');
    const token = sessionStorage.getItem('trishul_admin_token');
    const clientId = new URLSearchParams(location.search).get('client_id') || '';
    const $ = id => document.getElementById(id);
    const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const money = value => new Intl.NumberFormat(undefined, {style:'currency', currency:'USD', maximumFractionDigits:2}).format(Number(value) || 0);
    const labels = {onboarded:'Onboarded funds',funds_added:'Funds added',offboarded:'Funds withdrawn',profit_withdrawn:'Profits withdrawn'};
    let clientEvents = [];
    let currentPage = 1;

    async function getJson(path) {
      const response = await fetch(API_BASE + path, {headers:{'Content-Type':'application/json',Authorization:'Bearer ' + token}});
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw Error(data.message || 'Request failed');
      return data;
    }

    function renderHistory() {
      const query = $('historySearch').value.trim().toLowerCase();
      const filtered = clientEvents.filter(event => [event.account_number, labels[event.event_type] || event.event_type].some(value => String(value || '').toLowerCase().includes(query)));
      const size = Number($('pageSize').value);
      const pages = Math.max(1, Math.ceil(filtered.length / size));
      currentPage = Math.min(Math.max(currentPage, 1), pages);
      const start = (currentPage - 1) * size;
      const rows = filtered.slice(start, start + size);
      $('historyRows').innerHTML = rows.map(event => {
        const debit = event.event_type === 'offboarded' || event.event_type === 'profit_withdrawn';
        const label = labels[event.event_type] || event.event_type || 'Transaction';
        const amount = Number(event.amount) || 0;
        const deleted = Boolean(event.deleted_at);
        return `<tr class="${deleted ? 'deleted' : ''}"><td>${escapeHTML(new Date(event.created_at).toLocaleString())}</td><td>${escapeHTML(event.account_number)}</td><td>${deleted ? 'Deleted · ' : ''}${escapeHTML(label)}</td><td class="${debit ? 'debit' : 'credit'}">${debit ? '−' : '+'}${money(amount)}</td></tr>`;
      }).join('') || '<tr><td colspan="4" class="empty">No matching transactions for this client.</td></tr>';
      $('pageStatus').textContent = filtered.length ? `${start + 1}–${Math.min(start + size, filtered.length)} of ${filtered.length}` : '0 results';
      $('previousPage').disabled = currentPage === 1;
      $('nextPage').disabled = currentPage === pages;
    }

    async function loadClientHistory() {
      if (!clientId) throw Error('Client ID is missing from this page link.');
      if (!token) throw Error('Your admin session has expired. Sign in again to view client history.');
      const [portfolio, clientData] = await Promise.all([
        getJson('/api/admin/portfolio'),
        getJson('/api/admin/portfolio/clients')
      ]);
      const client = (clientData.clients || []).find(item => item.client_id === clientId);
      clientEvents = (portfolio.events || []).filter(event => event.client_id === clientId);
      const activeEvents = clientEvents.filter(event => !event.deleted_at);
      const fundsOnboarded = activeEvents.filter(event => event.event_type === 'onboarded' || event.event_type === 'funds_added').reduce((total, event) => total + (Number(event.amount) || 0), 0);
      const profitsWithdrawn = activeEvents.filter(event => event.event_type === 'profit_withdrawn').reduce((total, event) => total + (Number(event.amount) || 0), 0);
      const accounts = new Set(clientEvents.map(event => event.account_number).filter(Boolean));
      const name = client ? `${client.first_name || ''} ${client.second_name || ''}`.trim() : clientEvents.find(event => event.client_name)?.client_name || 'Client';
      $('clientName').textContent = name;
      $('clientId').textContent = `Client ID: ${clientId}`;
      $('fundsOnboarded').textContent = money(fundsOnboarded);
      $('profitsWithdrawn').textContent = money(profitsWithdrawn);
      $('transactionCount').textContent = activeEvents.length;
      $('accountCount').textContent = `${accounts.size} trading ${accounts.size === 1 ? 'account' : 'accounts'}`;
      renderHistory();
    }

    $('historySearch').addEventListener('input', () => {currentPage = 1; renderHistory()});
    $('pageSize').addEventListener('change', () => {currentPage = 1; renderHistory()});
    $('previousPage').addEventListener('click', () => {currentPage--; renderHistory()});
    $('nextPage').addEventListener('click', () => {currentPage++; renderHistory()});
    loadClientHistory().catch(error => {
      $('pageError').textContent = error.message;
      $('pageError').hidden = false;
      $('historyRows').innerHTML = '<tr><td colspan="4" class="empty">Unable to load client transactions.</td></tr>';
      $('accountCount').textContent = 'History unavailable';
    });
  </script>
</body>
</html>
