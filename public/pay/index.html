<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Pay Invoice | Trishul Capital</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#202632;background:#f3f5f8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:28px 16px}
    main{width:min(100%,760px);margin:0 auto}
    .company{display:flex;align-items:center;gap:12px;margin:0 0 16px}
    .company-logo{width:52px;height:52px;object-fit:contain;border-radius:8px;background:#fff}
    .company h1{font-size:17px;margin:0 0 5px}
    .company-contact{display:flex;flex-wrap:wrap;gap:4px 14px;color:#697586;font-size:11px}
    .card{overflow:hidden;border:1px solid #e3e7ed;border-radius:15px;background:#fff;box-shadow:0 10px 28px #17203312}
    .top{padding:21px 24px 17px;border-bottom:1px solid #edf0f3}
    .eyebrow{font-size:10px;letter-spacing:.1em;color:#697586;font-weight:700}
    .top h2{font-size:23px;margin:7px 0}
    .top p{margin:0;color:#697586;line-height:1.45}
    .summary{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;margin:16px 24px;padding:14px 16px;border:1px solid #edf0f3;border-radius:10px;background:#f8f9fb}
    .summary small{display:block;margin-bottom:4px;color:#697586}
    .summary strong{font-size:14px}
    .inr{font-size:22px!important;color:#15834a}
    .body{padding:1px 24px 22px}
    .body h3{font-size:15px;margin:12px 0 10px}
    .methods{display:flex;flex-wrap:wrap;gap:8px}
    .method{min-width:120px;padding:10px 13px;border:1px solid #dfe4ea;border-radius:9px;background:#fff;color:#354052;text-align:left;font-weight:700;cursor:pointer}
    .method small{display:block;margin-top:4px;color:#788392;font-size:11px;font-weight:400}
    .method.active{padding:9px 12px;border:2px solid #168447;background:#f2fbf5;color:#126f3e}
    .details{display:grid;grid-template-columns:minmax(0,1fr) 135px;gap:15px;margin-top:13px;padding:15px;border:1px solid #e5e9ef;border-radius:11px}
    .details h4{font-size:14px;margin:0 0 8px}
    .row{display:grid;grid-template-columns:minmax(125px,1fr) minmax(0,1.3fr);gap:10px;align-items:start;padding:7px 0;border-bottom:1px solid #eef0f3;font-size:12px}
    .row:last-child{border-bottom:0}
    .row span{color:#697586}
    .row strong{text-align:right;overflow-wrap:anywhere;line-height:1.4}
    .money{color:#168447;font-size:14px}
    .qr{display:grid;place-items:center;align-content:center;gap:7px;padding:9px;border:1px solid #e9edf1;border-radius:8px;background:#f7f8fa;color:#687384;text-align:center;font-size:10px;line-height:1.35}
    .qr img{display:block;width:min(100%,110px);height:auto;object-fit:contain}
    .button{display:block;width:100%;margin-top:10px;padding:11px;border:0;border-radius:8px;background:#168447;color:#fff;text-align:center;text-decoration:none;font-weight:700;cursor:pointer}
    .button.secondary{border:1px solid #cbd1d9;background:#fff;color:#202632}
    .note{margin:12px 0 0;color:#6b7583;font-size:11px;line-height:1.45}
    .notice{margin:16px 0;color:#596273;font-size:13px;line-height:1.5}
    [hidden]{display:none!important}
    a:focus-visible,button:focus-visible{outline:3px solid #245dd8;outline-offset:3px}
    @media(max-width:600px){
      body{padding:16px 12px}
      .top,.body{padding-right:17px;padding-left:17px}
      .summary{margin-right:17px;margin-left:17px}
      .company-contact{display:grid}
      .details{grid-template-columns:1fr}
      .qr{grid-template-columns:auto 1fr;justify-content:start}
      .row{grid-template-columns:minmax(105px,.8fr) minmax(0,1.2fr)}
    }
  </style>
</head>
<body>
  <main>
    <header id="company" class="company" hidden>
      <img id="companyLogo" class="company-logo" alt="">
      <div>
        <h1 id="companyName"></h1>
        <div id="companyContact" class="company-contact"></div>
      </div>
    </header>
    <p id="paymentError" class="notice" role="alert" hidden></p>
    <article id="paymentCard" class="card" hidden>
      <header class="top">
        <div class="eyebrow">SECURE INVOICE PAYMENT</div>
        <h2>Complete your payment</h2>
        <p>Select one of the payment methods configured by the company.</p>
      </header>
      <section id="invoiceSummary" class="summary"></section>
      <section class="body">
        <h3>Available payment methods</h3>
        <div id="paymentMethods" class="methods" role="group" aria-label="Available payment methods"></div>
        <div id="paymentDetails" aria-live="polite"></div>
        <p class="note">Payments are verified manually. Check the recipient and selected network carefully before sending.</p>
      </section>
    </article>
  </main>
  <script type="module">
    import { createPaymentLinks } from './payment.js';

    const apiBase = (window.TRISHUL_API_URL || '').replace(/\/$/, '');
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const error = document.getElementById('paymentError');
    const text = (tag, value, className = '') => {
      const element = document.createElement(tag);
      element.textContent = value || '';
      if (className) element.className = className;
      return element;
    };
    const row = (label, value, className = '') => {
      const element = document.createElement('div');
      element.className = 'row';
      element.append(text('span', label), text('strong', value, className));
      return element;
    };
    const moneyInr = value => new Intl.NumberFormat('en-IN', {
      style: 'currency', currency: 'INR', minimumFractionDigits: 2
    }).format(Number(value) || 0);
    const formatDate = value => {
      const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(value || ''));
      return match ? `${match[3]}/${match[2]}/${match[1]}` : '';
    };
    const showError = message => {
      error.textContent = message;
      error.hidden = false;
    };
    const addCopyButton = (value, label) => {
      const button = text('button', label, 'button');
      button.type = 'button';
      button.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(value);
          button.textContent = 'Copied';
        } catch {
          showError(`Copy the value manually: ${value}`);
        }
      });
      return button;
    };
    const qrPanel = (dataUrl, alt) => {
      const panel = document.createElement('div');
      panel.className = 'qr';
      if (dataUrl) {
        const image = document.createElement('img');
        image.src = dataUrl;
        image.alt = alt;
        panel.append(image, text('span', `Scan ${alt}`));
      } else {
        panel.append(text('span', 'QR code not configured'));
      }
      return panel;
    };

    function renderCompany(company) {
      const header = document.getElementById('company');
      document.getElementById('companyName').textContent = company.name || 'Payment details';
      const contact = document.getElementById('companyContact');
      contact.replaceChildren();
      [company.email, company.phone, company.address].filter(Boolean)
        .forEach(value => contact.append(text('span', value)));
      const logo = document.getElementById('companyLogo');
      if (company.logo_data_url) {
        logo.src = company.logo_data_url;
        logo.alt = `${company.name || 'Company'} logo`;
        logo.hidden = false;
      } else {
        logo.hidden = true;
      }
      header.hidden = false;
    }

    function renderMethodDetails(method, payment, invoiceReference) {
      const details = document.createElement('section');
      details.className = 'details';
      const content = document.createElement('div');
      const qr = qrPanel(method.qr_data_url, method.type === 'upi' ? 'UPI QR code' : 'crypto QR code');
      if (method.type === 'upi') {
        content.append(text('h4', 'UPI payment'));
        content.append(
          row('Payee name', method.payee_name),
          row('UPI ID', method.upi_id),
          row('Invoice total', moneyInr(payment.amount), 'money')
        );
        const links = createPaymentLinks({
          pa: method.upi_id,
          pn: method.payee_name,
          am: Number(payment.amount).toFixed(2),
          tn: `Invoice ${invoiceReference}`.slice(0, 80)
        });
        const isAndroid = /Android/i.test(navigator.userAgent);
        const appLink = document.createElement('a');
        appLink.className = 'button';
        appLink.href = isAndroid ? links.googlePay : links.otherUpi;
        appLink.textContent = isAndroid ? 'Continue to Google Pay' : 'Open UPI app';
        appLink.rel = 'noopener';
        content.append(appLink, addCopyButton(method.upi_id, 'Copy UPI ID'));
      } else if (method.type === 'bank') {
        content.append(text('h4', 'Bank transfer'));
        content.append(
          row('Account name', method.account_name),
          row('Account number', method.account_number),
          row('Bank', method.bank_name),
          row('Branch', method.branch),
          row('IFSC', method.ifsc),
          row('Payment reference', invoiceReference)
        );
        const bankInfo = [method.account_name, method.account_number, method.bank_name, method.branch, method.ifsc]
          .filter(Boolean).join('\n');
        content.append(addCopyButton(bankInfo, 'Copy bank details'));
      } else {
        content.append(text('h4', `Crypto payment · ${method.coin}`));
        content.append(
          row('Network', method.network),
          row('Wallet address', method.wallet_address),
          row('Entered amount (USD)', `$${Number(payment.usd_amount || 0).toFixed(2)} USD`, 'money'),
          row('Invoice total (INR)', `${moneyInr(payment.amount)} INR`, 'money')
        );
        content.append(addCopyButton(method.wallet_address, 'Copy wallet address'));
      }
      details.append(content, qr);
      return details;
    }

    function renderPayment(payment) {
      document.getElementById('invoiceSummary').replaceChildren();
      document.getElementById('paymentMethods').replaceChildren();
      document.getElementById('paymentDetails').replaceChildren();
      renderCompany(payment.company || {});
      const reference = payment.invoice_number || '';
      const summary = document.getElementById('invoiceSummary');
      const invoiceDetails = document.createElement('div');
      invoiceDetails.append(
        text('small', `Invoice ${reference}${payment.account_number ? ` · Account ${payment.account_number}` : ''}`),
        text('strong', `Entered amount: $${Number(payment.usd_amount || 0).toFixed(2)} USD`)
      );
      summary.append(invoiceDetails, text('strong', `${moneyInr(payment.amount)} INR`, 'inr'));
      const methodButtons = document.getElementById('paymentMethods');
      const detailContainer = document.getElementById('paymentDetails');
      if (payment.payment_status === 'paid') {
        detailContainer.append(text('p', 'This invoice has already been marked as paid.', 'notice'));
      } else if (!payment.methods?.length) {
        detailContainer.append(text('p', 'No payment methods are currently available. Please contact the company.', 'notice'));
      } else {
        payment.methods.forEach((method, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'method';
          const label = method.type === 'upi' ? `UPI · ${index + 1}`
            : method.type === 'bank' ? 'BANK'
              : `CRYPTO · ${method.coin}`;
          const sublabel = method.type === 'upi' ? method.upi_id
            : method.type === 'bank' ? 'Bank transfer'
              : method.network;
          button.append(text('span', label), text('small', sublabel));
          button.setAttribute('aria-pressed', 'false');
          button.addEventListener('click', () => {
            methodButtons.querySelectorAll('button').forEach(item => {
              const active = item === button;
              item.classList.toggle('active', active);
              item.setAttribute('aria-pressed', String(active));
            });
            detailContainer.replaceChildren(renderMethodDetails(method, payment, reference));
          });
          methodButtons.append(button);
        });
        methodButtons.querySelector('button').click();
      }
      document.getElementById('paymentCard').hidden = false;
    }

    async function loadPayment() {
      if (!token) {
        showError('This payment link is incomplete. Please open Pay Now from your invoice.');
        return;
      }
      try {
        const response = await fetch(`${apiBase}/api/public/payment?token=${encodeURIComponent(token)}`);
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.message || 'Payment details could not be loaded.');
        renderPayment(result.payment);
      } catch (loadError) {
        showError(loadError.message || 'Payment details could not be loaded.');
      }
    }

    if (params.get('preview') === '1') {
      window.addEventListener('message', event => {
        if (event.origin !== window.location.origin || event.source !== window.parent
          || event.data?.type !== 'billing-payment-preview' || !event.data.payment) return;
        error.hidden = true;
        renderPayment(event.data.payment);
      }, { once: true });
    } else {
      loadPayment();
    }
  </script>
</body>
</html>
